<script>

/* =========================================================
   อ่านข้อมูลจาก localStorage
   ========================================================= */

function getData() {

    try {

        const data =
            localStorage.getItem(
                "ktisFeedPrintData"
            );

        if (data) {

            return JSON.parse(data);

        }

    } catch (error) {

        console.error(error);

    }

    return null;
}


/* =========================================================
   ใส่ข้อความ
   ========================================================= */

function setText(id, value) {

    const el =
        document.getElementById(id);

    if (!el) return;

    el.textContent =
        value ?? "";

}


/* =========================================================
   วันที่
   ========================================================= */

function formatDate(value) {

    if (!value) return "";

    const d =
        new Date(value);

    if (isNaN(d.getTime())) {

        return value;

    }

    return (
        String(d.getDate()).padStart(2, "0")
        + "/"
        +
        String(d.getMonth() + 1).padStart(2, "0")
        + "/"
        +
        d.getFullYear()
    );

}


/* =========================================================
   ตัวเลข
   ========================================================= */

function number(value, decimals = 0) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "";

    }

    const n =
        Number(
            String(value)
                .replace(/,/g, "")
        );

    if (isNaN(n)) {

        return value;

    }

    return n.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        }
    );

}


/* =========================================================
   คำนวณ Ton
   ========================================================= */

function calcTon(before, after) {

    if (
        before === "" ||
        after === ""
    ) {

        return "";

    }

    const b =
        Number(
            String(before)
                .replace(/,/g, "")
        );

    const a =
        Number(
            String(after)
                .replace(/,/g, "")
        );

    if (
        isNaN(b) ||
        isNaN(a)
    ) {

        return "";

    }

    let result;

    if (a >= b) {

        result =
            (a - b) / 1000;

    } else {

        result =
            (
                (99999999 - b)
                + a
                + 1
            ) / 1000;

    }

    return result.toFixed(3);

}


/* =========================================================
   ใส่ข้อมูล 1 รายการ
   ========================================================= */

function fillSection(data, no) {

    if (!data) return;


    /* วันที่ */

    setText(
        `date${no}`,
        formatDate(data.date)
    );


    /* ก่อนฟีด */

    setText(
        `preA${no}`,
        number(data.preFeedA)
    );

    setText(
        `preB${no}`,
        number(data.preFeedB)
    );


    /* หลังฟีด */

    setText(
        `postA${no}`,
        number(data.postFeedA)
    );

    setText(
        `postB${no}`,
        number(data.postFeedB)
    );


    /* จำนวน */

    let qtyA =
        data.quantityA;

    let qtyB =
        data.quantityB;


    if (
        qtyA === "" ||
        qtyA === undefined
    ) {

        qtyA =
            calcTon(
                data.preFeedA,
                data.postFeedA
            );

    }


    if (
        qtyB === "" ||
        qtyB === undefined
    ) {

        qtyB =
            calcTon(
                data.preFeedB,
                data.postFeedB
            );

    }


    setText(
        `qtyA${no}`,
        number(qtyA, 3)
    );

    setText(
        `qtyB${no}`,
        number(qtyB, 3)
    );


    /* รวม */

    let total =
        data.totalQuantity;


    if (
        total === "" ||
        total === undefined
    ) {

        total =
            (
                Number(qtyA || 0)
                +
                Number(qtyB || 0)
            ).toFixed(3);

    }


    setText(
        `total${no}`,
        number(total, 3)
    );


    /* DCS */

    setText(
        `order${no}`,
        data.dcsOrderTime
    );

    setText(
        `stop${no}`,
        data.dcsStopTime
    );


    /* พนักงาน */

    setText(
        `ls${no}`,
        data.lsEmployeeCheck
    );

    setText(
        `warehouse${no}`,
        data.warehouseEmployee
    );


    /* Hopper */

    setText(
        `hopperA${no}`,
        number(data.hopperSugarA)
    );

    setText(
        `hopperB${no}`,
        number(data.hopperSugarB)
    );


    /* สถานะ */

    const status =
        String(
            data.feedStatus || ""
        ).trim();


    if (
        status === "ปกติ"
    ) {

        setText(
            `normal${no}`,
            "✓"
        );

        setText(
            `abnormal${no}`,
            ""
        );

    }
    else if (
        status === "ไม่ปกติ"
    ) {

        setText(
            `normal${no}`,
            ""
        );

        setText(
            `abnormal${no}`,
            "✓"
        );

    }


    /* หมายเหตุ */

    setText(
        `note${no}`,
        data.notes
    );


    /* ผู้บันทึก */

    setText(
        `recorder${no}`,
        data.recorderEmployee
    );


    /* ผู้ตรวจสอบ */

    setText(
        `checker${no}`,
        data.checkerEmployee
    );

}


/* =========================================================
   เริ่มต้น
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const data =
            getData();


        if (!data) {

            document.getElementById(
                "status"
            ).textContent =
                "ไม่พบข้อมูล กรุณากลับไปกรอกข้อมูลในหน้าหลัก";

            return;

        }


        /*
         * รองรับทั้ง
         * object 1 รายการ
         * และ array สูงสุด 3 รายการ
         */

        let records;


        if (Array.isArray(data)) {

            records = data;

        }
        else if (
            Array.isArray(data.records)
        ) {

            records = data.records;

        }
        else {

            records = [data];

        }


        records
            .slice(0, 3)
            .forEach(
                function(record, index) {

                    fillSection(
                        record,
                        index + 1
                    );

                }
            );


        document.getElementById(
            "status"
        ).textContent =
            "FM-WT-68 พร้อมพิมพ์";

    }
);

</script>
