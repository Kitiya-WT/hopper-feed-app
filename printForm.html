<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FM-WT-68 - พิมพ์แบบฟอร์ม</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #e5e7eb;
            font-family: Tahoma, Arial, "Noto Sans Thai", sans-serif;
        }

        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            padding: 10px;
            background: rgba(255,255,255,.96);
            border-bottom: 1px solid #d1d5db;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .toolbar button {
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-print {
            background: #2563eb;
            color: white;
        }

        .btn-close {
            background: #6b7280;
            color: white;
        }

        .empty-message {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .empty-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }

        /*
         * FM-WT-68 ต้นฉบับเป็นขนาด Letter
         * 216 x 279 mm
         */
        .page {
            position: relative;

            width: 216mm;
            height: 279mm;

            margin: 70px auto 20px auto;

            background: white;
            overflow: hidden;

            box-shadow: 0 2px 15px rgba(0,0,0,.20);
        }

        .template {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: fill;
        }

        .value {
            position: absolute;

            transform: translate(-50%, -50%);

            color: #000;

            font-family:
                Tahoma,
                Arial,
                "Noto Sans Thai",
                sans-serif;

            font-size: 9pt;
            font-weight: normal;

            line-height: 1.05;

            white-space: nowrap;

            z-index: 10;

            pointer-events: none;

            text-align: center;
        }

        .small {
            font-size: 8pt;
        }

        .employee {
            font-size: 8.5pt;
        }

        .number {
            font-size: 8.5pt;
        }

        .total {
            font-weight: bold;
            font-size: 9pt;
        }

        .check {
            font-size: 15pt;
            font-weight: bold;
            line-height: 1;
        }

        .notes {
            position: absolute;

            z-index: 10;

            color: #000;

            font-family:
                Tahoma,
                Arial,
                "Noto Sans Thai",
                sans-serif;

            font-size: 7.5pt;

            line-height: 16.2px;

            white-space: nowrap;

            overflow: hidden;

            width: 185px;

            pointer-events: none;
        }

        .notes div {
            height: 16.2px;
            overflow: hidden;
        }

        @page {
            size: Letter portrait;
            margin: 0;
        }

        @media print {

            html,
            body {
                background: white;
            }

            .toolbar {
                display: none !important;
            }

            .page {
                width: 216mm;
                height: 279mm;

                margin: 0;

                box-shadow: none;

                page-break-after: always;
            }

            .page:last-child {
                page-break-after: auto;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         ปุ่มด้านบน
    =============================== -->
    <div class="toolbar">

        <button
            type="button"
            class="btn-print"
            onclick="window.print()"
        >
            🖨️ พิมพ์แบบฟอร์ม
        </button>

        <button
            type="button"
            class="btn-close"
            onclick="window.close()"
        >
            ✕ ปิด
        </button>

    </div>


    <!-- ==============================
         พื้นที่แสดงแบบฟอร์ม
    =============================== -->
    <div id="pageContainer"></div>


    <script>

        /*
        ==========================================================
        CONFIG
        ==========================================================
        */

        const STORAGE_KEY = "ktisFMWT68Records";

        const LAST_RECORD_KEY = "ktisLastFMWT68Feed";


        /*
        ==========================================================
        อ่านข้อมูลจาก LocalStorage
        ==========================================================
        */

        function getRecords() {

            let records = [];

            try {

                const data =
                    localStorage.getItem(STORAGE_KEY);

                if (data) {

                    const parsed = JSON.parse(data);

                    if (Array.isArray(parsed)) {
                        records = parsed;
                    }

                }

            } catch (error) {

                console.error(
                    "อ่านข้อมูลไม่สำเร็จ:",
                    error
                );

            }


            /*
             * ถ้าไม่มี Array ให้ลองใช้รายการล่าสุด
             */

            if (records.length === 0) {

                try {

                    const last =
                        localStorage.getItem(
                            LAST_RECORD_KEY
                        );

                    if (last) {

                        const parsed =
                            JSON.parse(last);

                        if (parsed) {
                            records = [parsed];
                        }

                    }

                } catch (error) {

                    console.error(
                        "อ่านข้อมูลล่าสุดไม่สำเร็จ:",
                        error
                    );

                }

            }


            /*
             * เอาเฉพาะ 3 รายการล่าสุด
             */

            return records.slice(-3);

        }


        /*
        ==========================================================
        แปลงวันที่เป็น พ.ศ.
        ==========================================================
        */

        function formatThaiDate(dateString) {

            if (!dateString) {
                return "";
            }

            const parts =
                String(dateString).split("-");

            if (parts.length !== 3) {
                return dateString;
            }

            const year =
                parseInt(parts[0], 10);

            const month =
                parts[1];

            const day =
                parts[2];

            if (
                Number.isNaN(year) ||
                !month ||
                !day
            ) {
                return dateString;
            }

            return (
                day +
                "/" +
                month +
                "/" +
                (year + 543)
            );

        }


        /*
        ==========================================================
        แปลงตัวเลข
        ==========================================================
        */

        function cleanValue(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value).trim();

        }


        /*
        ==========================================================
        แปลงตัวเลขเป็น 3 ตำแหน่ง
        ==========================================================
        */

        function formatTon(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "";
            }

            const number =
                Number(
                    String(value).replace(/,/g, "")
                );

            if (Number.isNaN(number)) {
                return value;
            }

            return number.toFixed(3);

        }


        /*
        ==========================================================
        แบ่งหมายเหตุออกเป็น 4 บรรทัด
        ==========================================================
        */

        function splitNotes(text) {

            text = cleanValue(text);

            if (!text) {
                return ["", "", "", ""];
            }

            const maxChars = 42;

            const result = [];

            let current = "";

            const words =
                text.split(/\s+/);

            for (const word of words) {

                const test =
                    current
                        ? current + " " + word
                        : word;

                if (test.length <= maxChars) {

                    current = test;

                } else {

                    if (current) {
                        result.push(current);
                    }

                    current = word;

                }

                if (result.length >= 4) {
                    break;
                }

            }

            if (
                current &&
                result.length < 4
            ) {
                result.push(current);
            }


            while (result.length < 4) {
                result.push("");
            }


            return result.slice(0, 4);

        }


        /*
        ==========================================================
        ตำแหน่งบนแบบฟอร์ม
        ==========================================================
        
        อ้างอิงจากแบบฟอร์ม Letter 612 x 792 pt
        */

        const PAGE_WIDTH = 612;
        const PAGE_HEIGHT = 792;


        function percentX(x) {

            return (
                (x / PAGE_WIDTH) * 100
            ) + "%";

        }


        function percentY(y) {

            return (
                (y / PAGE_HEIGHT) * 100
            ) + "%";

        }


        /*
        ==========================================================
        สร้าง Text Element
        ==========================================================
        */

        function createValue(
            page,
            text,
            x,
            y,
            className = ""
        ) {

            if (
                text === null ||
                text === undefined ||
                text === ""
            ) {
                return;
            }

            const el =
                document.createElement("div");

            el.className =
                "value " + className;

            el.textContent =
                cleanValue(text);

            el.style.left =
                percentX(x);

            el.style.top =
                percentY(y);

            page.appendChild(el);

        }


        /*
        ==========================================================
        สร้าง Notes
        ==========================================================
        */

        function createNotes(
            page,
            text,
            offsetY
        ) {

            const notes =
                splitNotes(text);

            const box =
                document.createElement("div");

            box.className = "notes";

            /*
             * จุดเริ่มต้นของหมายเหตุ
             */

            box.style.left =
                percentX(345);

            box.style.top =
                percentY(408 + offsetY);

            for (const line of notes) {

                const div =
                    document.createElement("div");

                div.textContent = line;

                box.appendChild(div);

            }

            page.appendChild(box);

        }


        /*
        ==========================================================
        เพิ่มเครื่องหมาย ✓
        ==========================================================
        */

        function createStatus(
            page,
            record,
            offsetY
        ) {

            const status =
                cleanValue(
                    record.feedStatus
                );

            /*
             * ปกติ
             */

            if (status === "ปกติ") {

                createValue(
                    page,
                    "✓",
                    147,
                    442 + offsetY,
                    "check"
                );

            }


            /*
             * ไม่ปกติ
             */

            if (status === "ไม่ปกติ") {

                createValue(
                    page,
                    "✓",
                    251,
                    442 + offsetY,
                    "check"
                );

            }

        }


        /*
        ==========================================================
        สร้างข้อมูล 1 Section
        ==========================================================
        */

        function renderRecord(
            page,
            record,
            offsetY
        ) {

            if (!record) {
                return;
            }


            /*
            ------------------------------------------------------
            วัน/เดือน/ปี
            ------------------------------------------------------
            */

            createValue(
                page,
                formatThaiDate(record.date),
                114.5,
                99.5 + offsetY,
                "small"
            );


            /*
            ------------------------------------------------------
            ตัวเลขก่อนฟีด A / B
            ------------------------------------------------------
            */

            createValue(
                page,
                record.preFeedA,
                198.3,
                99.5 + offsetY,
                "number"
            );

            createValue(
                page,
                record.preFeedB,
                198.3,
                115.8 + offsetY,
                "number"
            );


            /*
            ------------------------------------------------------
            ตัวเลขหลังฟีด A / B
            ------------------------------------------------------
            */

            createValue(
                page,
                record.postFeedA,
                306.2,
                99.5 + offsetY,
                "number"
            );

            createValue(
                page,
                record.postFeedB,
                306.2,
                115.8 + offsetY,
                "number"
            );


            /*
            ------------------------------------------------------
            จำนวน Ton A / B
            ------------------------------------------------------
            */

            createValue(
                page,
                formatTon(record.quantityA),
                386.5,
                99.5 + offsetY,
                "number"
            );

            createValue(
                page,
                formatTon(record.quantityB),
                386.5,
                115.8 + offsetY,
                "number"
            );


            /*
            ------------------------------------------------------
            รวม Ton
            ------------------------------------------------------
            */

            createValue(
                page,
                formatTon(record.totalQuantity),
                386.5,
                132.0 + offsetY,
                "total"
            );


            /*
            ------------------------------------------------------
            DCS สั่งตัก
            ------------------------------------------------------
            */

            createValue(
                page,
                record.dcsOrderTime,
                500.5,
                99.5 + offsetY,
                "small"
            );


            /*
            ------------------------------------------------------
            DCS สั่งหยุด
            ------------------------------------------------------
            */

            createValue(
                page,
                record.dcsStopTime,
                500.5,
                115.8 + offsetY,
                "small"
            );


            /*
            ------------------------------------------------------
            พนักงาน LS ด้านล่าง SILO
            ------------------------------------------------------
            */

            createValue(
                page,
                record.lsEmployeeCheck,
                254.5,
                376.0 + offsetY,
                "employee"
            );


            /*
            ------------------------------------------------------
            พนักงานคลังสินค้า ร่วมตรวจสอบ
            ------------------------------------------------------
            */

            createValue(
                page,
                record.warehouseEmployee,
                254.5,
                392.0 + offsetY,
                "employee"
            );


            /*
            ------------------------------------------------------
            Hopper A
            ------------------------------------------------------
            */

            createValue(
                page,
                record.hopperSugarA,
                500.5,
                376.0 + offsetY,
                "number"
            );


            /*
            ------------------------------------------------------
            Hopper B
            ------------------------------------------------------
            */

            createValue(
                page,
                record.hopperSugarB,
                500.5,
                392.0 + offsetY,
                "number"
            );


            /*
            ------------------------------------------------------
            สถานะ
            ------------------------------------------------------
            */

            createStatus(
                page,
                record,
                offsetY
            );


            /*
            ------------------------------------------------------
            หมายเหตุ
            ------------------------------------------------------
            */

            createNotes(
                page,
                record.notes,
                offsetY
            );


            /*
            ------------------------------------------------------
            ผู้บันทึก
            ------------------------------------------------------
            */

            createValue(
                page,
                record.recorderEmployee,
                185,
                498.5 + offsetY,
                "employee"
            );


            /*
            ------------------------------------------------------
            ผู้ตรวจสอบ
            ------------------------------------------------------
            */

            createValue(
                page,
                record.checkerEmployee,
                468,
                498.5 + offsetY,
                "employee"
            );

        }


        /*
        ==========================================================
        สร้างหน้าแบบฟอร์ม
        ==========================================================
        */

        function renderPage(records) {

            const container =
                document.getElementById(
                    "pageContainer"
                );

            container.innerHTML = "";


            const page =
                document.createElement("div");

            page.className = "page";


            /*
            ------------------------------------------------------
            รูปแบบฟอร์มต้นฉบับ
            ------------------------------------------------------
            */

            const template =
                document.createElement("img");

            template.className =
                "template";

            template.src =
                "FM-WT-68-template.png";

            template.alt =
                "FM-WT-68 Rev.01";


            /*
            ถ้าหาไฟล์ไม่เจอ
            */

            template.onerror = function () {

                console.error(
                    "ไม่พบไฟล์ FM-WT-68-template.png"
                );

                alert(
                    "ไม่พบไฟล์ FM-WT-68-template.png\n\n" +
                    "กรุณาตรวจสอบว่าไฟล์อยู่ในโฟลเดอร์เดียวกับ printForm.html"
                );

            };


            page.appendChild(template);


            /*
            ------------------------------------------------------
            Section 1
            ------------------------------------------------------
            */

            if (records[0]) {

                renderRecord(
                    page,
                    records[0],
                    0
                );

            }


            /*
            ------------------------------------------------------
            Section 2
            ------------------------------------------------------
            */

            if (records[1]) {

                renderRecord(
                    page,
                    records[1],
                    454.65
                );

            }


            /*
            ------------------------------------------------------
            Section 3
            ------------------------------------------------------
            */

            if (records[2]) {

                renderRecord(
                    page,
                    records[2],
                    909.30
                );

            }


            container.appendChild(page);

        }


        /*
        ==========================================================
        เริ่มต้น
        ==========================================================
        */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const records =
                    getRecords();

                if (!records.length) {

                    document.body.innerHTML = `
                        <div class="empty-message">
                            <div class="empty-box">
                                <h2>
                                    ไม่พบข้อมูลสำหรับพิมพ์
                                </h2>

                                <p>
                                    กรุณากลับไปบันทึกข้อมูล
                                    FM-WT-68 ก่อน
                                </p>

                                <button
                                    type="button"
                                    onclick="history.back()"
                                    style="
                                        border:0;
                                        padding:10px 20px;
                                        border-radius:8px;
                                        background:#2563eb;
                                        color:white;
                                        font-weight:bold;
                                        cursor:pointer;
                                    "
                                >
                                    ← กลับ
                                </button>
                            </div>
                        </div>
                    `;

                    return;

                }


                renderPage(records);

            }
        );

    </script>

</body>
</html>
