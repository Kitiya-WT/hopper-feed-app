<script>

/* =========================================================
   อ่านข้อมูล
   ========================================================= */

function getPrintData() {

    let data = null;


    /* -----------------------------------------
       วิธีที่ 1
       localStorage
       ----------------------------------------- */

    try {

        const saved =
            localStorage.getItem("ktisFeedPrintData");

        if (saved) {

            data = JSON.parse(saved);

        }

    } catch (error) {

        console.error(
            "อ่าน localStorage ไม่สำเร็จ",
            error
        );

    }


    /* -----------------------------------------
       วิธีที่ 2
       localStorage ชื่อเดิม
       ----------------------------------------- */

    if (!data) {

        try {

            const saved =
                localStorage.getItem("feedPrintData");

            if (saved) {

                data = JSON.parse(saved);

            }

        } catch (error) {

            console.error(error);

        }

    }


    /* -----------------------------------------
       วิธีที่ 3
       URL ?data=
       ----------------------------------------- */

    if (!data) {

        try {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const encoded =
                params.get("data");

            if (encoded) {

                data =
                    JSON.parse(
                        decodeURIComponent(encoded)
                    );

            }

        } catch (error) {

            console.error(
                "อ่านข้อมูลจาก URL ไม่สำเร็จ",
                error
            );

        }

    }


    return data;
}



/* =========================================================
   ฟังก์ชันช่วย
   ========================================================= */

function value(data, ...keys) {

    if (!data) {
        return "";
    }

    for (const key of keys) {

        if (
            data[key] !== undefined &&
            data[key] !== null &&
            data[key] !== ""
        ) {

            return data[key];

        }

    }

    return "";
}



function setText(id, text) {

    const el =
        document.getElementById(id);

    if (!el) {
        return;
    }

    el.textContent =
        text === undefined ||
        text === null
            ? ""
            : text;

}



/* =========================================================
   แปลงวันที่
   ========================================================= */

function formatDate(dateValue) {

    if (!dateValue) {
        return "";
    }


    const date =
        new Date(dateValue);


    if (isNaN(date.getTime())) {

        return dateValue;

    }


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const year =
        date.getFullYear();


    return `${day}/${month}/${year}`;

}



/* =========================================================
   แปลงตัวเลข
   ========================================================= */

function formatNumber(value, decimals = 3) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "";

    }


    const number =
        Number(
            String(value).replace(/,/g, "")
        );


    if (isNaN(number)) {

        return value;

    }


    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        }
    );

}



/* =========================================================
   คำนวณจำนวน Ton
   ========================================================= */

function calculateQuantity(pre, post) {

    if (
        pre === "" ||
        post === ""
    ) {

        return "";

    }


    const before =
        Number(
            String(pre).replace(/,/g, "")
        );

    const after =
        Number(
            String(post).replace(/,/g, "")
        );


    if (
        isNaN(before) ||
        isNaN(after)
    ) {

        return "";

    }


    let result;


    if (after >= before) {

        result =
            (after - before) / 1000;

    } else {

        /*
         * รองรับเลขมิเตอร์วนกลับ
         */

        result =
            (
                (99999999 - before)
                + after
                + 1
            ) / 1000;

    }


    return result.toFixed(3);

}



/* =========================================================
   ดึงข้อมูลแต่ละรายการ
   ========================================================= */

function normalizeRecord(record) {

    if (!record) {
        return null;
    }


    const preA =
        value(
            record,
            "preFeedA",
            "preA",
            "beforeA"
        );


    const preB =
        value(
            record,
            "preFeedB",
            "preB",
            "beforeB"
        );


    const postA =
        value(
            record,
            "postFeedA",
            "postA",
            "afterA"
        );


    const postB =
        value(
            record,
            "postFeedB",
            "postB",
            "afterB"
        );


    let quantityA =
        value(
            record,
            "quantityA",
            "qtyA"
        );


    let quantityB =
        value(
            record,
            "quantityB",
            "qtyB"
        );


    if (
        quantityA === "" &&
        preA !== "" &&
        postA !== ""
    ) {

        quantityA =
            calculateQuantity(
                preA,
                postA
            );

    }


    if (
        quantityB === "" &&
        preB !== "" &&
        postB !== ""
    ) {

        quantityB =
            calculateQuantity(
                preB,
                postB
            );

    }


    let total =
        value(
            record,
            "totalQuantity",
            "total",
            "totalTon"
        );


    if (
        total === "" &&
        (
            quantityA !== "" ||
            quantityB !== ""
        )
    ) {

        total =
            (
                Number(quantityA || 0)
                +
                Number(quantityB || 0)
            ).toFixed(3);

    }


    return {

        date:
            value(
                record,
                "date",
                "feedDate"
            ),

        preA,
        preB,

        postA,
        postB,

        quantityA,
        quantityB,

        total,

        dcsOrderTime:
            value(
                record,
                "dcsOrderTime",
                "dcsOrder"
            ),

        dcsStopTime:
            value(
                record,
                "dcsStopTime",
                "dcsStop"
            ),

        hopperSugarA:
            value(
                record,
                "hopperSugarA",
                "hopperA"
            ),

        hopperSugarB:
            value(
                record,
                "hopperSugarB",
                "hopperB"
            ),

        warehouseEmployee:
            value(
                record,
                "warehouseEmployee",
                "warehouse"
            ),

        lsEmployeeCheck:
            value(
                record,
                "lsEmployeeCheck",
                "lsEmployee",
                "lsEmployeeName"
            ),

        feedStatus:
            value(
                record,
                "feedStatus",
                "status"
            ),

        notes:
            value(
                record,
                "notes",
                "note"
            ),

        recorderEmployee:
            value(
                record,
                "recorderEmployee",
                "recorder"
            ),

        checkerEmployee:
            value(
                record,
                "checkerEmployee",
                "checker"
            )

    };

}



/* =========================================================
   ใส่ข้อมูลลง Section
   ========================================================= */

function fillSection(record, section) {

    if (!record) {
        return;
    }


    /* วันที่ */

    setText(
        `date${section}`,
        formatDate(record.date)
    );


    /* ก่อนฟีด */

    setText(
        `preA${section}`,
        formatNumber(record.preA, 0)
    );

    setText(
        `preB${section}`,
        formatNumber(record.preB, 0)
    );


    /* หลังฟีด */

    setText(
        `postA${section}`,
        formatNumber(record.postA, 0)
    );

    setText(
        `postB${section}`,
        formatNumber(record.postB, 0)
    );


    /* จำนวน */

    setText(
        `qtyA${section}`,
        formatNumber(record.quantityA, 3)
    );

    setText(
        `qtyB${section}`,
        formatNumber(record.quantityB, 3)
    );


    /* รวม */

    setText(
        `total${section}`,
        formatNumber(record.total, 3)
    );


    /* DCS */

    setText(
        `dcsOrder${section}`,
        record.dcsOrderTime
    );

    setText(
        `dcsStop${section}`,
        record.dcsStopTime
    );


    /* พนักงาน */

    setText(
        `lsEmployee${section}`,
        record.lsEmployeeCheck
    );

    setText(
        `warehouseEmployee${section}`,
        record.warehouseEmployee
    );


    /* Hopper */

    setText(
        `hopperA${section}`,
        formatNumber(
            record.hopperSugarA,
            0
        )
    );

    setText(
        `hopperB${section}`,
        formatNumber(
            record.hopperSugarB,
            0
        )
    );


    /* สถานะ */

    const normal =
        document.getElementById(
            `normal${section}`
        );

    const abnormal =
        document.getElementById(
            `abnormal${section}`
        );


    if (
        String(record.feedStatus)
            .trim()
            .includes("ปกติ")
            &&
        !String(record.feedStatus)
            .trim()
            .includes("ไม่ปกติ")
    ) {

        normal.textContent = "✓";

        abnormal.textContent = "";

    }
    else if (
        String(record.feedStatus)
            .trim()
            .includes("ไม่ปกติ")
    ) {

        normal.textContent = "";

        abnormal.textContent = "✓";

    }
    else {

        normal.textContent = "";

        abnormal.textContent = "";

    }


    /* หมายเหตุ */

    setText(
        `note${section}`,
        record.notes
    );


    /* ผู้บันทึก */

    setText(
        `recorder${section}`,
        record.recorderEmployee
    );


    /* ผู้ตรวจสอบ */

    setText(
        `checker${section}`,
        record.checkerEmployee
    );

}



/* =========================================================
   โหลดข้อมูล
   ========================================================= */

function loadForm() {

    const raw =
        getPrintData();


    if (!raw) {

        document.getElementById(
            "status"
        ).textContent =
            "ไม่พบข้อมูลสำหรับพิมพ์";

        return;

    }


    /*
     * รองรับทั้ง
     *
     * 1 รายการ
     *
     * และ
     *
     * Array 3 รายการ
     */

    let records;


    if (Array.isArray(raw)) {

        records = raw;

    }
    else if (
        Array.isArray(raw.records)
    ) {

        records = raw.records;

    }
    else if (
        Array.isArray(raw.data)
    ) {

        records = raw.data;

    }
    else {

        records = [raw];

    }


    records =
        records
            .slice(0, 3)
            .map(normalizeRecord);


    records.forEach(
        (record, index) => {

            fillSection(
                record,
                index + 1
            );

        }
    );


    document.getElementById(
        "status"
    ).textContent =
        `พบข้อมูล ${records.filter(Boolean).length} รายการ`;

}


/* =========================================================
   เริ่มทำงาน
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadForm
);

</script>
